[package]
name = "deskling"
version = "0.1.0"
description = "A tiny desktop workshop that shows what your AI agent is actually doing."
authors = ["Deskling contributors"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "deskling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["macos-private-api"] }
